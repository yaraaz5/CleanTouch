<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Service — Clean Touch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="container header-row">
    <a class="brand" href="index.html"><img src="images/logo.png" alt=""><span class="title">clean touch</span></a>
    <nav><ul class="nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a class="active" href="customer-dashboard.html">Customer Dashboard</a></li>
      <li><a href="provider-dashboard.html">Provider Dashboard</a></li>
    </ul></nav>
  </div>
</header>

<main class="container">
  <p class="breadcrumbs"><a href="customer-dashboard.html">Customer Dashboard</a> › Request a Service</p>

  <section class="card">
    <h1 style="text-align:center; margin-bottom:16px;">Request a Service</h1>
    <form class="form-grid">
      <label>Select Service
        <select>
          <option>— Choose —</option>
          <option>Dry Cleaning</option>
          <option>Ironing</option>
          <option>Stain Removal</option>
        </select>
      </label>

      <label>Full Name
        <input type="text">
      </label>

      <div class="form-2" style="display:grid; gap:14px; margin-top:6px">
        <label>Date
          <input type="date">
        </label>
        <label>Time
          <input type="text" placeholder="e.g., 10:30 AM">
        </label>
      </div>

      <div class="form-2" style="display:grid; gap:14px; margin-top:6px">
        <label>Vouchers/Gift Card code
          <input type="text">
        </label>
        <div style="align-self:end"><button class="btn gray" type="button">Apply</button></div>
      </div>

      <label>Description
        <textarea></textarea>
      </label>

      <div class="form-actions">
        <button type="reset" class="btn gray">Cancel</button>
        <button type="submit" class="btn" disabled>Submit</button>
      </div>
    </form>
  </section>
</main>

<footer>
  <div class="container footer-inner">
    <div class="footer-col"><img src="images/placeholder.jpg" alt="" style="width:160px; height:100px; background:#cfe9ff"></div>
    <div class="footer-col"><h4>Contact us</h4><p>Simply dummy text of the printing</p><p class="copy">©Copyright</p></div>
    <div class="footer-col"><div class="icon-placeholder"></div></div>
    <div class="footer-col"><div class="icon-placeholder"></div></div>
    <div class="footer-col"><div class="icon-placeholder"></div></div>
  </div>
</footer>
</body>
</html>
